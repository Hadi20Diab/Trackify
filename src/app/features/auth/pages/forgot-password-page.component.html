<section class="auth-page">
  <app-public-header />

  <div class="auth-page__content auth-page__content--single">
    <article class="auth-card auth-card--narrow">
      <p class="auth-eyebrow">Account Recovery</p>
      <h1>Reset your password</h1>
      <p>
        Enter your email address and we will send a secure reset link.
      </p>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          <mat-icon matSuffix>mail</mat-icon>
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <mat-error>Enter a valid email address.</mat-error>
          }
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting()">
          @if (isSubmitting()) {
            <mat-spinner diameter="18"></mat-spinner>
          } @else {
            Send Reset Link
          }
        </button>
      </form>

      <div class="auth-links">
        <a routerLink="/auth/login">Back to sign in</a>
      </div>
    </article>
  </div>
</section>
